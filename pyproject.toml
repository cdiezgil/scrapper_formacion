[project]
name = "scrapper-formacion"
version = "0.1.0"
description = "Descargador de cursos de plataformas de formación"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.47",
    "yt-dlp>=2024.9",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.8",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
]

[project.scripts]
scrapper = "src.cli:app"

[tool.ruff]
line-length = 100
